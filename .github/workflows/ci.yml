name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No API keys and no network: the Gemini client is replaced with stand-ins.
      - name: Unit and integration tests
        run: python -m pytest -q
      # Offline retrieval evaluation over the committed index. Fails the build if
      # ranking quality drops below the floor (the current run is well above it).
      - name: Retrieval regression gate
        run: python tests/rag_eval.py --top-k 5 --min-hit-rate 0.8 --min-mrr 0.6

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t getnet-support .
      - name: Run the tests inside the image
        run: docker run --rm getnet-support python -m pytest -q
      - name: Start the container and check /health
        run: |
          docker run -d --name api -p 8000:8000 getnet-support
          for i in $(seq 1 30); do
            curl -fs localhost:8000/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1